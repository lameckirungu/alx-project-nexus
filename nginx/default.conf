server {
    listen 80;
    server_name _;

    location /api/accounts/ {
        proxy_pass http://accounts-service:8000/api/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/cart/ {
        proxy_pass http://cart-service:8000/api/cart/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8000/api/catalog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders/ {
        proxy_pass http://orders-service:8000/api/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/payments/ {
        proxy_pass http://payments-service:8000/api/payments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Schema - route to catalog service (or pick any service)
    location /api/schema/ {
        proxy_pass http://catalog-service:8000/api/schema/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Docs - route to catalog service (or pick any service)
    location /api/docs/ {
        proxy_pass http://catalog-service:8000/api/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Microservices API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        .endpoint { background: #f4f4f4; padding: 10px; margin: 10px 0; border-radius: 5px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>E-Commerce Microservices API</h1>
    <p>Welcome to the E-Commerce API Gateway. Available services:</p>
    
    <h2>📚 Documentation</h2>
    <div class="endpoint">
        <strong><a href="/api/docs/">API Documentation (Swagger UI)</a></strong>
    </div>
    <div class="endpoint">
        <strong><a href="/api/schema/">API Schema (OpenAPI)</a></strong>
    </div>
    
    <h2>🔌 Service Endpoints</h2>
    <div class="endpoint">
        <strong><a href="/api/accounts/">Accounts Service</a></strong> - User authentication and management
    </div>
    <div class="endpoint">
        <strong><a href="/api/cart/">Cart Service</a></strong> - Shopping cart operations
    </div>
    <div class="endpoint">
        <strong><a href="/api/catalog/">Catalog Service</a></strong> - Product catalog and categories
    </div>
    <div class="endpoint">
        <strong><a href="/api/orders/">Orders Service</a></strong> - Order management
    </div>
    <div class="endpoint">
        <strong><a href="/api/payments/">Payments Service</a></strong> - Payment processing
    </div>
</body>
</html>';
    }

    location / {
        return 404;
    }
}
